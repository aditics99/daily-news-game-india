name: Publish India daily news game

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research, write, and validate today’s edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/publish_daily_edition.py
      - name: Commit the generated edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-game.js index.html
          if git diff --cached --quiet; then
            echo "The generated edition matches the current site."
          else
            git commit -m "Publish India news edition $(TZ=Asia/Kolkata date +'%Y-%m-%d')"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the site
        run: |
          mkdir -p dist
          cp index.html editorial.html app.js styles.css supabase-config.js news-game.css news-game.js dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish today’s edition
        id: deployment
        uses: actions/deploy-pages@v4
